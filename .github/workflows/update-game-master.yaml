name: Sync latest.json
on:
  schedule:
    - cron: '0 6 * * *'   # once a day at 06:00 UTC
  workflow_dispatch:       

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if timestamp changed
        id: check
        run: |
          mkdir -p data
          curl -sL -o /tmp/timestamp.txt https://raw.githubusercontent.com/PokeMiners/game_masters/master/latest/timestamp.txt

          if [ -f data/timestamp.txt ] && cmp -s /tmp/timestamp.txt data/timestamp.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch latest data
        if: steps.check.outputs.changed == 'true'
        run: |
          cp /tmp/timestamp.txt data/timestamp.txt
          curl -sL -o data/latest.json https://raw.githubusercontent.com/PokeMiners/game_masters/master/latest/latest.json

      - name: Commit if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/timestamp.txt data/latest.json
          git diff --staged --quiet || git commit -m "Update Game Master ($(cat data/timestamp.txt))"
          git push