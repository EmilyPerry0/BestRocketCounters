name: Sync Rocket Lineups
on:
  schedule:
    - cron: '30 6 * * *'   # once a day at 06:30 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if data changed
        id: check
        run: |
          mkdir -p data
          curl -sL -o /tmp/rocketLineups.json https://raw.githubusercontent.com/bigfoott/ScrapedDuck/data/rocketLineups.json

          if [ -f data/rocketLineups.json ] && cmp -s /tmp/rocketLineups.json data/rocketLineups.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update rocket lineups
        if: steps.check.outputs.changed == 'true'
        run: |
          cp /tmp/rocketLineups.json data/rocketLineups.json

      - name: Commit if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/rocketLineups.json
          git diff --staged --quiet || git commit -m "Update Rocket lineups"
          git push
